name: TVMaze checks

on:
  push:
    paths:
      - "TVMaze/**"
      - ".github/workflows/tvmaze.yml"
  pull_request:
    paths:
      - "TVMaze/**"
      - ".github/workflows/tvmaze.yml"

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TVMaze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m mypy
