<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>TVMaze Show Search</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background: #f3f5f9;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at 50% 0, #e1eaff 0, transparent 48%),
        #f3f5f9;
    }

    main {
      width: min(100%, 680px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #5368a6;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #111827;
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 12px 0 28px;
      color: #596579;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .search-panel, .result {
      border: 1px solid #e4e8f0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 55px rgb(22 35 66 / 8%);
    }

    .search-panel { padding: 22px; }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px 14px;
      border: 1px solid #cbd2df;
      border-radius: 10px;
      color: #172033;
      font: inherit;
    }

    input:focus {
      border-color: #5368d8;
      outline: 3px solid rgb(83 104 216 / 17%);
    }

    button {
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: #4357c5;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
    }

    button:hover { background: #3548b0; }
    button:disabled { cursor: wait; opacity: 0.65; }

    .status {
      min-height: 24px;
      margin: 14px 2px 0;
      color: #596579;
      font-size: 0.92rem;
    }

    .status.error { color: #b42335; }

    .result {
      margin-top: 18px;
      padding: 22px;
    }

    .result h2 {
      margin: 0 0 16px;
      font-size: 1.15rem;
    }

    dl {
      display: grid;
      grid-template-columns: minmax(110px, 0.35fr) 1fr;
      gap: 13px 18px;
      margin: 0;
    }

    dt { color: #68748a; }
    dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

    .source {
      margin: 18px 0 0;
      color: #68748a;
      font-size: 0.85rem;
    }

    .source a { color: #4357c5; }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      body { padding: 32px 16px; }
      .search-panel, .result { padding: 18px; }
      .search-row { flex-direction: column; }
      button { min-height: 46px; }
      dl { grid-template-columns: 1fr; gap: 5px; }
      dd { margin-bottom: 9px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Powered by TVMaze</p>
    <h1>Find a TV show</h1>
    <p class="intro">Search for a show to see its rating, genres, and premiere date.</p>

    <form class="search-panel" id="search-form">
      <label for="show-name">TV show name</label>
      <div class="search-row">
        <input id="show-name" name="q" type="search" placeholder="e.g. The Office" required maxlength="200" autocomplete="off">
        <button id="search-button" type="submit">Search</button>
      </div>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="result" id="result" aria-labelledby="result-heading" hidden>
      <h2 id="result-heading">Show details</h2>
      <dl id="details"></dl>
      <p class="source" id="source"></p>
    </section>
  </main>
  <script>
    const form = document.querySelector("#search-form");
    const input = document.querySelector("#show-name");
    const button = document.querySelector("#search-button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const details = document.querySelector("#details");
    const source = document.querySelector("#source");
    const labels = {
      title: "Title",
      genre: "Genres",
      rating: "Rating",
      premiere_date: "Premiere date",
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const showName = input.value.trim();
      if (!showName) {
        input.focus();
        return;
      }

      button.disabled = true;
      status.className = "status";
      status.textContent = "Searching TVMaze…";
      result.hidden = true;
      details.replaceChildren();
      source.replaceChildren();

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(showName)}`);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "The search failed. Please try again.");
        }
        if (!data.show) {
          status.textContent = data.message;
          return;
        }

        for (const [field, value] of Object.entries(data.show)) {
          const term = document.createElement("dt");
          term.textContent = labels[field] || field;
          const description = document.createElement("dd");
          description.textContent = String(value);
          details.append(term, description);
        }

        const link = document.createElement("a");
        link.href = data.source;
        link.textContent = "TVMaze";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        source.append("Source: ", link);
        result.hidden = false;
        status.textContent = "";
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message || "Could not complete the search.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
