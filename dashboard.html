<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales dashboard</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17251f;
      background: #f3f6f3;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { max-width: 1280px; margin: 0 auto; padding: 48px 32px 64px; }
    .eyebrow { color: #50816a; font-size: 12px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 9px 0 7px; font-size: clamp(30px, 4vw, 42px); letter-spacing: -.045em; }
    .subtitle { margin: 0; color: #68766f; }
    .topline { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .updated { color: #7a8780; font-size: 13px; white-space: nowrap; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card, .panel { border: 1px solid #e3eae5; border-radius: 15px; background: #fff; box-shadow: 0 5px 20px #18332608; }
    .card { padding: 19px 21px; }
    .card-label { color: #718078; font-size: 13px; font-weight: 600; }
    .card-value { margin-top: 10px; font-size: 29px; font-weight: 750; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .content { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; align-items: start; }
    .panel { overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 19px 20px; border-bottom: 1px solid #edf1ee; }
    h2 { margin: 0; font-size: 16px; letter-spacing: -.015em; }
    .filters { display: flex; flex-wrap: wrap; gap: 9px; padding: 15px 20px; border-bottom: 1px solid #edf1ee; }
    select, input { min-width: 145px; border: 1px solid #dfe7e1; border-radius: 8px; padding: 9px 11px; color: #26352d; background: white; font: inherit; font-size: 13px; outline: none; }
    select:focus, input:focus { border-color: #599779; box-shadow: 0 0 0 3px #59977920; }
    input[type="search"] { flex: 1; min-width: 180px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 13px; }
    th { padding: 12px 14px; color: #76827b; background: #fafcfb; font-size: 11px; font-weight: 700; letter-spacing: .055em; text-align: left; text-transform: uppercase; }
    th button { display: inline-flex; gap: 5px; align-items: center; border: 0; padding: 0; color: inherit; background: transparent; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
    td { padding: 13px 14px; border-top: 1px solid #eff2f0; }
    tbody tr:hover { background: #f8fbf8; }
    .number { text-align: right; font-variant-numeric: tabular-nums; }
    .region { display: inline-block; border-radius: 999px; padding: 5px 9px; color: #38664f; background: #edf6ef; font-size: 12px; font-weight: 650; }
    .count { color: #77847c; font-size: 12px; }
    .empty { padding: 35px 20px; color: #77847c; text-align: center; }
    .breakdown { padding: 6px 20px 19px; }
    .region-row { padding-top: 15px; }
    .region-label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; font-size: 13px; }
    .region-label strong { font-variant-numeric: tabular-nums; }
    .track { height: 7px; overflow: hidden; border-radius: 99px; background: #edf2ee; }
    .bar { height: 100%; border-radius: inherit; background: #4b9b70; }
    .message { margin: 20px 0; border-radius: 10px; padding: 13px 15px; color: #74442e; background: #fff3e8; font-size: 14px; }
    .hidden { display: none; }
    @media (max-width: 850px) { .content { grid-template-columns: 1fr; } }
    @media (max-width: 600px) {
      .shell { padding: 30px 16px 42px; }
      .topline { align-items: flex-start; flex-direction: column; }
      .cards { grid-template-columns: 1fr; gap: 10px; }
      .card { padding: 15px 17px; }
      .card-value { font-size: 25px; }
      .panel-head { padding: 16px; }
      .filters { padding: 13px 16px; }
      select, input { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topline">
      <div>
        <div class="eyebrow">Sales overview</div>
        <h1>Sales dashboard</h1>
        <p class="subtitle">Explore sales performance across regions, people and products.</p>
      </div>
      <div class="updated" id="updated"></div>
    </header>

    <div id="error" class="message hidden" role="alert"></div>

    <section class="cards" aria-label="Sales summary">
      <article class="card"><div class="card-label">Total sales</div><div class="card-value" id="total-sales">—</div></article>
      <article class="card"><div class="card-label">Orders</div><div class="card-value" id="order-count">—</div></article>
      <article class="card"><div class="card-label">Average order value</div><div class="card-value" id="average-sale">—</div></article>
    </section>

    <div class="content">
      <section class="panel">
        <div class="panel-head">
          <h2>All sales</h2>
          <span class="count" id="visible-count"></span>
        </div>
        <div class="filters">
          <select id="region-filter" aria-label="Filter by region"><option value="">All regions</option></select>
          <select id="salesperson-filter" aria-label="Filter by salesperson"><option value="">All salespeople</option></select>
          <select id="category-filter" aria-label="Filter by category"><option value="">All categories</option></select>
          <input type="search" id="search" placeholder="Search orders or products" aria-label="Search sales">
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr id="headers"></tr></thead>
            <tbody id="sales-body"></tbody>
          </table>
          <div class="empty hidden" id="empty">No sales match these filters.</div>
        </div>
      </section>
      <aside class="panel">
        <div class="panel-head"><h2>Sales by region</h2></div>
        <div class="breakdown" id="region-breakdown"></div>
      </aside>
    </div>
  </main>
  <script>
    const columns = [
      ["date", "Date"], ["order_id", "Order"], ["region", "Region"],
      ["salesperson", "Salesperson"], ["product", "Product"],
      ["category", "Category"], ["quantity", "Qty"],
      ["unit_price", "Unit price"], ["sales_amount", "Sales"]
    ];
    let sales = [];
    let sortKey = "date";
    let sortDirection = -1;
    const money = amount => new Intl.NumberFormat("en-GB", {
      style: "currency", currency: "GBP"
    }).format(amount);

    function setOptions(elementId, values) {
      const element = document.getElementById(elementId);
      for (const value of [...new Set(values)].sort()) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        element.append(option);
      }
    }

    function currentSales() {
      const region = document.getElementById("region-filter").value;
      const salesperson = document.getElementById("salesperson-filter").value;
      const category = document.getElementById("category-filter").value;
      const query = document.getElementById("search").value.trim().toLowerCase();
      return sales.filter(row =>
        (!region || row.region === region) &&
        (!salesperson || row.salesperson === salesperson) &&
        (!category || row.category === category) &&
        (!query || [row.order_id, row.product, row.region, row.salesperson, row.category]
          .some(value => value.toLowerCase().includes(query)))
      );
    }

    function render() {
      const rows = currentSales();
      const total = rows.reduce((sum, row) => sum + row.sales_amount, 0);
      document.getElementById("total-sales").textContent = money(total);
      document.getElementById("order-count").textContent = rows.length.toLocaleString("en-GB");
      document.getElementById("average-sale").textContent = money(rows.length ? total / rows.length : 0);
      document.getElementById("visible-count").textContent =
        `Showing ${rows.length} of ${sales.length} orders`;

      rows.sort((a, b) => {
        const left = a[sortKey], right = b[sortKey];
        const result = typeof left === "number" && typeof right === "number"
          ? left - right
          : String(left).localeCompare(String(right), "en", {numeric: true});
        return result * sortDirection;
      });

      const body = document.getElementById("sales-body");
      body.replaceChildren();
      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);
      for (const row of rows) {
        const tr = document.createElement("tr");
        for (const [key] of columns) {
          const td = document.createElement("td");
          if (key === "quantity" || key === "unit_price" || key === "sales_amount") td.className = "number";
          if (key === "region") {
            const badge = document.createElement("span");
            badge.className = "region";
            badge.textContent = row[key];
            td.append(badge);
          } else {
            td.textContent = key === "unit_price" || key === "sales_amount"
              ? money(row[key]) : String(row[key]);
          }
          tr.append(td);
        }
        body.append(tr);
      }
      renderRegions(rows);
    }

    function renderRegions(rows) {
      const totals = new Map();
      for (const row of rows) totals.set(row.region, (totals.get(row.region) || 0) + row.sales_amount);
      const entries = [...totals].sort((a, b) => b[1] - a[1]);
      const max = Math.max(0, ...entries.map(([, total]) => total));
      const breakdown = document.getElementById("region-breakdown");
      breakdown.replaceChildren();
      for (const [region, total] of entries) {
        const item = document.createElement("div");
        item.className = "region-row";
        const label = document.createElement("div");
        label.className = "region-label";
        const name = document.createElement("span");
        name.textContent = region;
        const value = document.createElement("strong");
        value.textContent = money(total);
        label.append(name, value);
        const track = document.createElement("div");
        track.className = "track";
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = `${max ? total / max * 100 : 0}%`;
        track.append(bar);
        item.append(label, track);
        breakdown.append(item);
      }
    }

    function setupHeaders() {
      const headers = document.getElementById("headers");
      for (const [key, label] of columns) {
        const th = document.createElement("th");
        if (key === "quantity" || key === "unit_price" || key === "sales_amount") th.className = "number";
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.addEventListener("click", () => {
          sortDirection = sortKey === key ? -sortDirection : 1;
          sortKey = key;
          render();
        });
        th.append(button);
        headers.append(th);
      }
    }

    async function start() {
      setupHeaders();
      try {
        const response = await fetch("/api/sales", {cache: "no-store"});
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        sales = await response.json();
        setOptions("region-filter", sales.map(row => row.region));
        setOptions("salesperson-filter", sales.map(row => row.salesperson));
        setOptions("category-filter", sales.map(row => row.category));
        document.getElementById("updated").textContent = `${sales.length} cleaned sales records`;
        document.querySelectorAll(".filters select, .filters input")
          .forEach(element => element.addEventListener("input", render));
        render();
      } catch (error) {
        const message = document.getElementById("error");
        message.textContent = `Unable to load sales data. Run python main.py to create cleaned_sales.csv, then restart this app. (${error.message})`;
        message.classList.remove("hidden");
      }
    }
    start();
  </script>
</body>
</html>
